name: hello world

on:
  push:
      branches:
          - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Linter Check via Docker
        run: docker run --rm -v "$(pwd):/pwd" --workdir /pwd rhysd/actionlint:latest

      - name: Pre-Phase (Environment & .env Setup)
        run: |
          echo "Running pre-phase environment setup..."
          
          # Writing configuration to .env
          echo "Writing configuration to .env..."
          cat <<EOF > .env
          HOMELAB_NODE=swissland-cluster
          PROJECT_NAME=hello-world-action
          BUILD_ENV=staging
          FUN_FACT="Proxmox ZFS mirrors save the day!"
          EOF

          echo "Loading .env variables into GitHub environment..."
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done < .env

          echo "Environment variables loaded successfully!"
          echo "Target Node: ${{ env.HOMELAB_NODE }}"
          echo "Current Environment: ${{ env.BUILD_ENV }}"

      - name: Build Phase (Containerized)
        run: |
          echo "Creating temporary Dockerfile..."
          echo -e "FROM alpine:latest\nCMD [\"echo\", \"Hello from inside the temporary container! Building for node: ${HOMELAB_NODE}\"]" > Dockerfile
          
          echo "Building Docker image..."
          docker build -t temp-hello-app .
          
          echo "Running container with auto-cleanup (--rm)..."
          docker run --rm temp-hello-app

      - name: Run echo with Env Vars
        run: |
          echo "Hello, world from pipeline!"
          echo "Running on node: $HOMELAB_NODE"
          echo "Fun fact of the day: $FUN_FACT"

      - name: Post-Phase (Cleanup & Teardown)
        if: always()
        run: |
          echo "Running post-phase cleanup..."
          docker rmi temp-hello-app || true
          rm -f Dockerfile .env
          echo "Cleanup complete. Runner is pristine!"